ServerName localhost

<Directory /var/www/html>
    Options -Indexes
</Directory>

<DirectoryMatch "/var/www/html/(dev|docs)(/|$)">
    Require all denied
</DirectoryMatch>

<LocationMatch "/\.">
    Require all denied
</LocationMatch>

<FilesMatch "\.(sql|md|yaml|yml)$">
    Require all denied
</FilesMatch>
