name: beestat-dev

services:
  web:
    build: ./dev
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - .:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: beestat
      MYSQL_USER: beestat
      MYSQL_PASSWORD: beestat-local-only
      MYSQL_ROOT_PASSWORD: beestat-root-local-only
    volumes:
      - database:/var/lib/mysql
      - ./api/beestat.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT api_user_id FROM api_user LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  database:
